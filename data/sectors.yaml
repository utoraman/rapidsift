# Sector ETF mapping for industry-adjusted signals.
# Each ticker maps to its sector ETF. When computing sector_drop,
# the stock's return is compared to its sector ETF instead of SPY.
#
# ETFs used:
#   XLK  - Technology          XLC  - Communication Services
#   XLY  - Consumer Discret.   XLF  - Financials
#   XLE  - Energy              XLV  - Healthcare
#   XLI  - Industrials         XLB  - Materials
#   XLP  - Consumer Staples    XLU  - Utilities / Clean Energy
#   XLRE - Real Estate         BITO - Crypto / Mining
