schedule:
  interval_minutes: 15
  market_hours_only: true
  market_open: 09:30
  market_close: '16:00'
  timezone: US/Eastern
signals:
  price_threshold:
    enabled: true
    rules: null
  percent_change:
    enabled: true
    daily_threshold: 3.0
    intraday_threshold: 2.0
  technical:
    enabled: true
    rsi:
      period: 14
      oversold: 30
      overbought: 70
    macd:
      fast: 12
      slow: 26
      signal: 9
    moving_average_crossover:
      fast_period: 20
      slow_period: 50
  volume:
    enabled: true
    spike_multiplier: 2.0
  adjusted_return:
    enabled: true
    drop_threshold: -5.0
    surge_threshold: 5.0
email:
  enabled: false
  smtp_host: ''
  smtp_port: 587
  username: ''
  password: ''
  from_addr: ''
  to_addr: ''
dashboard:
  host: 127.0.0.1
  port: 8050
