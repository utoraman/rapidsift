name: Signal Alerts

on:
  schedule:
    # Market open (9:30 AM ET / 3:30 PM CET), then every 2h until 8 PM CET
    - cron: '30 13,15,17 * * 1-5'
  workflow_dispatch:  # Allow manual trigger

jobs:
  detect-and-notify:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install yfinance pandas pyyaml cairosvg requests
          sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Run signal detection & notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/notify_telegram.py

      - name: Generate dashboard signals JSON
        run: |
          mkdir -p _site/data
          python3 scripts/generate_signals_json.py

      - name: Commit updated signals and state data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f _site/data/signals.json .signal_state.json
          git diff --cached --quiet && echo "No changes to commit" || \
            (git commit -m "Update live signals data [skip ci]" && git push)
