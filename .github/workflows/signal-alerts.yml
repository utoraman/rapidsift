name: Signal Alerts

on:
  schedule:
    # Every 90 min during US market hours (9:30 AM - 4 PM ET = 13:30-20:00 UTC)
    # Plus one after-close run at 20:30 UTC for final EOD signals
    - cron: '30 14 * * 1-5'    # 10:30 AM ET / 16:30 CET
    - cron: '0 16 * * 1-5'     # 12:00 PM ET / 18:00 CET
    - cron: '30 17 * * 1-5'    # 01:30 PM ET / 19:30 CET
    - cron: '0 19 * * 1-5'     # 03:00 PM ET / 21:00 CET
    - cron: '30 20 * * 1-5'    # 04:30 PM ET / 22:30 CET (after close, final EOD)
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  detect-and-notify:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install yfinance pandas pyyaml cairosvg requests
          sudo apt-get update && sudo apt-get install -y libcairo2-dev

      - name: Run signal detection & notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/notify_telegram.py

      - name: Generate dashboard signals JSON
        run: |
          mkdir -p _site/data
          python3 scripts/generate_signals_json.py

      - name: Commit updated signals and state data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f _site/data/signals.json .signal_state.json
          git diff --cached --quiet && echo "No changes to commit" || \
            (git commit -m "Update live signals data [skip ci]" && git push)

      - name: Trigger Vercel deploy
        if: always()
        run: |
          curl -s -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}" || echo "Deploy hook failed (non-fatal)"
